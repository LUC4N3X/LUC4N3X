<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 300" role="img" aria-label="Levyra Flagship Project">
  <defs>
    <linearGradient id="iconBgLight" x1="44" y1="44" x2="298" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F6"/>
    </linearGradient>
    <linearGradient id="accentLight" x1="352" y1="188" x2="1000" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="glowLight" cx="167" cy="150" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Left Icon Frame -->
  <rect x="36" y="38" width="262" height="224" rx="24" fill="url(#iconBgLight)" stroke="#D8DEE4" stroke-width="2"/>
  <circle cx="167" cy="150" r="110" fill="url(#glowLight)"/>
  <image href="https://raw.githubusercontent.com/LUC4N3X/Levyra-deepsound/main/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" xlink:href="https://raw.githubusercontent.com/LUC4N3X/Levyra-deepsound/main/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" x="67" y="50" width="200" height="200" preserveAspectRatio="xMidYMid meet"/>

  <!-- Right Typography -->
  <g font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace">
    <circle cx="356" cy="80" r="4" fill="#6366F1"/>
    <text x="372" y="85" fill="#6366F1" font-size="14" font-weight="600" letter-spacing="2">FLAGSHIP PROJECT / AUDIO ENGINE</text>

    <text x="352" y="160" fill="#1E293B" font-size="82" font-weight="700" letter-spacing="3">LEVY<tspan fill="url(#accentLight)">RA</tspan></text>

    <path d="M352 188H1140" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M352 188H720" stroke="url(#accentLight)" stroke-width="2.5" opacity="0.9"/>

    <text x="352" y="226" fill="#64748B" font-size="18" letter-spacing="1.2">media3 · compose · synced lyrics · offline vault</text>
    <text x="980" y="226" fill="#0284C7" font-size="16" letter-spacing="1">android · windows</text>
    <circle cx="1130" cy="221" r="4" fill="#0284C7"/>
  </g>
</svg>