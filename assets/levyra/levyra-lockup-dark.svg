<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 300" role="img" aria-label="Levyra Flagship Project">
  <defs>
    <linearGradient id="iconBg" x1="44" y1="44" x2="298" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1022"/>
      <stop offset="1" stop-color="#060814"/>
    </linearGradient>
    <linearGradient id="accent" x1="352" y1="188" x2="1000" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="167" cy="150" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#060814" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="36" y="38" width="262" height="224" rx="24" fill="url(#iconBg)" stroke="#262B44" stroke-width="2"/>
  <circle cx="167" cy="150" r="110" fill="url(#glow)"/>
  <image xlink:href="data:image/png;base64," x="67" y="50" width="200" height="200" preserveAspectRatio="xMidYMid meet"/>
  <g font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace">
    <circle cx="356" cy="80" r="4" fill="#818CF8" filter="url(#softGlow)"/>
    <text x="372" y="85" fill="#818CF8" font-size="14" font-weight="600" letter-spacing="2">FLAGSHIP PROJECT / AUDIO ENGINE</text>
    <text x="352" y="160" fill="#F0F6FC" font-size="82" font-weight="700" letter-spacing="3">LEVY<tspan fill="url(#accent)">RA</tspan></text>
    <path d="M352 188H1140" stroke="#21262D" stroke-width="2"/>
    <path d="M352 188H720" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
    <text x="352" y="226" fill="#8B949E" font-size="18" letter-spacing="1.2">media3 · compose · synced lyrics · offline vault</text>
    <text x="980" y="226" fill="#38BDF8" font-size="16" letter-spacing="1">android · windows</text>
    <circle cx="1130" cy="221" r="4" fill="#38BDF8" filter="url(#softGlow)"/>
  </g>
</svg>