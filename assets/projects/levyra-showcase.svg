<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Levyra featured project</title>
  <desc id="desc">A dark Levyra project banner with playback, discovery and product polish motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070718"/>
      <stop offset="0.56" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#101527"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="70" x2="340" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8FF"/>
      <stop offset="0.5" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#FF5C9A"/>
    </linearGradient>
    <linearGradient id="art" x1="90" y1="58" x2="300" y2="282" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16264A"/>
      <stop offset="0.46" stop-color="#4A2A74"/>
      <stop offset="1" stop-color="#311A40"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(238 164) rotate(25) scale(240 210)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#67E8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#6B7A99" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#bg)" stroke="#25314A" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#dots)"/>
  <ellipse cx="240" cy="164" rx="250" ry="215" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="58" y="52" width="260" height="256" rx="26" fill="#0D1326" stroke="#2B3954"/>
    <rect x="76" y="70" width="224" height="188" rx="22" fill="url(#art)"/>
    <circle cx="188" cy="164" r="70" fill="#080B18" fill-opacity="0.72" stroke="url(#accent)" stroke-width="4"/>
    <circle cx="188" cy="164" r="52" fill="#0C1020" stroke="#91EFFF" stroke-opacity="0.24"/>
    <path d="M169 129C169 124 175 121 179 124L223 158C227 161 227 167 223 170L179 204C175 207 169 204 169 199V129Z" fill="url(#accent)"/>
    <path d="M105 143C123 117 151 101 185 101C217 101 246 116 266 143" stroke="#67E8FF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.55"/>
    <path d="M107 188C128 213 156 226 188 226C220 226 248 212 268 187" stroke="#FF5C9A" stroke-width="3" stroke-linecap="round" stroke-opacity="0.48"/>
    <circle cx="102" cy="144" r="5" fill="#67E8FF"/>
    <circle cx="270" cy="187" r="5" fill="#FF5C9A"/>

    <text x="88" y="284" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">NOW PLAYING</text>
    <text x="88" y="303" fill="#8FA0BE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">playback • lyrics • discovery</text>
  </g>

  <g>
    <text x="372" y="87" fill="#67E8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3">FEATURED PROJECT</text>
    <text x="370" y="151" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="1">LEVYRA</text>
    <text x="372" y="184" fill="#A9B6CF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Open-source music player for Android &amp; Windows</text>

    <g transform="translate(372 216)">
      <rect width="138" height="38" rx="19" fill="#101B2C" stroke="#28415D"/>
      <circle cx="20" cy="19" r="4" fill="#67E8FF"/>
      <text x="34" y="24" fill="#DCE6F7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">PLAYBACK</text>
    </g>
    <g transform="translate(522 216)">
      <rect width="146" height="38" rx="19" fill="#17172B" stroke="#403864"/>
      <circle cx="20" cy="19" r="4" fill="#9C7DFF"/>
      <text x="34" y="24" fill="#E8E0FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">DISCOVERY</text>
    </g>
    <g transform="translate(680 216)">
      <rect width="120" height="38" rx="19" fill="#261521" stroke="#5A2E4C"/>
      <circle cx="20" cy="19" r="4" fill="#FF5C9A"/>
      <text x="34" y="24" fill="#FFE1EE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">POLISH</text>
    </g>

    <text x="372" y="292" fill="#7E8DA9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">KOTLIN  •  JETPACK COMPOSE  •  MEDIA3  •  EXOPLAYER</text>
  </g>

  <g transform="translate(860 58)">
    <rect width="282" height="244" rx="24" fill="#0D1322" stroke="#273650"/>
    <text x="24" y="38" fill="#C6D0E3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PLAYER CORE</text>

    <rect x="24" y="60" width="234" height="72" rx="18" fill="#111A2D" stroke="#263A55"/>
    <circle cx="58" cy="96" r="18" fill="#1C2840"/>
    <path d="M53 86L68 96L53 106V86Z" fill="#67E8FF"/>
    <text x="88" y="91" fill="#F1F5FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Resilient playback</text>
    <text x="88" y="111" fill="#7E8DA9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">queues • recovery • media paths</text>

    <g transform="translate(24 151)">
      <rect width="234" height="4" rx="2" fill="#1C2940"/>
      <rect width="156" height="4" rx="2" fill="url(#accent)"/>
      <circle cx="156" cy="2" r="6" fill="#E8FAFF" stroke="#67E8FF" stroke-width="2"/>
    </g>

    <g transform="translate(25 185)" stroke-linecap="round">
      <path d="M0 17H14M22 17H34M42 17H56M64 17H77M85 17H100M108 17H119M127 17H142M150 17H165M173 17H187M195 17H208M216 17H232" stroke="#26344F" stroke-width="4"/>
      <path d="M0 17H14M22 17H34M42 17H56M64 17H77M85 17H100M108 17H119M127 17H142" stroke="#67E8FF" stroke-width="4"/>
    </g>

    <text x="24" y="229" fill="#73839E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">Built for real devices, not just happy paths.</text>
  </g>
</svg>
