<svg width="800" height="180" viewBox="0 0 800 180" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="LUC4N3X">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="neonIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="35%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>

    <!-- Diffuse Ambient Glow -->
    <radialGradient id="neonAura" cx="80" cy="85" r="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left: Pure Vector Minimalist Neon LX Monogram (Centered at x=85) -->
  <g transform="translate(85, 15)">
    <!-- Diffuse Aura -->
    <circle cx="75" cy="72" r="75" fill="url(#neonAura)"/>

    <!-- 1. The L Monogram (Double-Track Neon Blade) -->
    <path d="M 28 22 L 28 116 L 86 116 L 86 102 L 42 102 L 42 22 Z"
          fill="url(#neonCyan)"
          opacity="0.45"
          filter="url(#intenseGlow)"/>

    <path d="M 28 22 L 28 116 L 86 116 L 86 102 L 42 102 L 42 22 Z"
          fill="url(#neonCyan)"/>

    <!-- Inner L Line Reflection (Laser Core) -->
    <path d="M 35 30 L 35 109 L 80 109"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.85"/>

    <!-- 2. The Interlocking X Monogram -->
    <!-- Diagonal 1: Top-Right to Bottom-Left -->
    <path d="M 122 22 L 100 22 L 54 86 L 54 104 L 72 104 L 122 36 Z"
          fill="url(#neonIndigo)"
          opacity="0.45"
          filter="url(#intenseGlow)"/>
    <path d="M 122 22 L 100 22 L 54 86 L 54 104 L 72 104 L 122 36 Z"
          fill="url(#neonIndigo)"/>
    <line x1="110" y1="26" x2="63" y2="95" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Diagonal 2: Top-Left to Bottom-Right -->
    <g filter="url(#softGlow)">
      <path d="M 52 28 L 68 28 L 86 54 L 74 68 Z" fill="url(#neonCyan)"/>
      <line x1="56" y1="32" x2="80" y2="61" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

      <path d="M 88 72 L 122 116 L 104 116 L 76 82 Z" fill="url(#neonCyan)"/>
      <line x1="82" y1="77" x2="114" y2="114" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Optical Interlock Shadow at Crossing -->
    <polygon points="76,66 88,72 82,82 72,76" fill="#0A0E1A" opacity="0.6"/>

    <!-- Quantum Focus Center Pulse -->
    <circle cx="80" cy="74" r="3" fill="#00F2FE" filter="url(#softGlow)"/>
  </g>

  <!-- Right: Master Typography (Centered at x=265) -->
  <g transform="translate(265, 20)">
    <!-- Eyebrow -->
    <circle cx="4" cy="18" r="3.5" fill="#00F2FE" filter="url(#softGlow)"/>
    <text x="16" y="22" fill="#38BDF8" font-family="'JetBrains Mono', SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="3.5">SOFTWARE ENGINEER &amp; CREATOR</text>

    <!-- Wordmark -->
    <text x="0" y="74" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Montserrat, sans-serif" font-size="64" font-weight="900" letter-spacing="4">
      LUC4N3<tspan fill="url(#neonCyan)">X</tspan>
    </text>

    <!-- Laser Horizon Line (Balanced to 450px) -->
    <rect x="0" y="94" width="450" height="2.5" rx="1" fill="url(#laserBeam)"/>
    <circle cx="0" cy="95" r="3.5" fill="#00F2FE" filter="url(#softGlow)"/>
  </g>
</svg>