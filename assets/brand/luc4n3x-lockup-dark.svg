  <text x="62" y="120" fill="#8B949E" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="18" letter-spacing="1">~/dev/luc4n3x</text>
  <path d="M70 158L100 180L70 202" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>
  <path d="M122 204H184" stroke="#F0F6FC" stroke-width="10" stroke-linecap="square"/>
