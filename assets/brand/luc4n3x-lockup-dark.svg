<svg width="880" height="180" viewBox="0 0 880 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LUC4N3X">
  <defs>
    <!-- Master Brand Gradients -->
    <linearGradient id="cyberX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21262D"/>
      <stop offset="100%" stop-color="#111418"/>
    </linearGradient>

    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#30363D"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="beamHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#818CF8"/>
      <stop offset="80%" stop-color="#30363D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#30363D" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonReflect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Centered Lockup Group -->
  <g transform="translate(60, 20)">
    <!-- 1. The Master Cyber Emblem (140 x 140) -->
    <g transform="translate(10, 0)">
      <!-- Hexagonal Tech Tile with Precision Chamfers -->
      <path d="M 70 8 L 126 40 L 126 100 L 70 132 L 14 100 L 14 40 Z" fill="url(#shieldFill)" stroke="url(#shieldRim)" stroke-width="2"/>

      <!-- Corner Tech Notches -->
      <line x1="70" y1="12" x2="70" y2="20" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="70" y1="120" x2="70" y2="128" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

      <!-- 'L' Monogram Blade (Architectural Solid Base) -->
      <path d="M 38 42 L 38 98 L 74 98" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 'X' Monogram Energy Cross (Precision Angled Blades) -->
      <!-- Primary Laser Blade (Down-Right) -->
      <path d="M 64 52 L 102 98" stroke="url(#cyberX)" stroke-width="8" stroke-linecap="round" filter="url(#neonReflect)"/>
      
      <!-- Counter Blade (Up-Right with Negative Space Interlock) -->
      <path d="M 102 52 L 83 75" stroke="url(#cyberX)" stroke-width="8" stroke-linecap="round"/>
      <path d="M 69 92 L 64 98" stroke="url(#cyberX)" stroke-width="8" stroke-linecap="round"/>

      <!-- Central Quantum Dot / Core Focus -->
      <circle cx="70" cy="70" r="3" fill="#38BDF8"/>
    </g>

    <!-- 2. The Master Wordmark (Pure, Bold, Authoritative, Zero Fluff) -->
    <g transform="translate(195, 20)">
      <!-- LUC4N3X Display Typography -->
      <text x="0" y="72" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Montserrat', sans-serif" font-size="64" font-weight="900" letter-spacing="4">
        LUC4N3<tspan fill="url(#cyberX)">X</tspan>
      </text>

      <!-- Signature Horizon Beam (Dynamic, razor thin, laser refined) -->
      <rect x="0" y="90" width="540" height="2" rx="1" fill="url(#beamHoriz)"/>
    </g>
  </g>
</svg>