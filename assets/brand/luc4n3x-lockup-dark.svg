  <path d="M222 170L232 180L222 190M239 190H247" fill="none" stroke="#58A6FF" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>

  <text x="352" y="158" fill="#F0F6FC" font-family="SFMono-Regular,Consolas,'Liberation Mono',monospace" font-size="92" font-weight="700" letter-spacing="2">LUC4N3<tspan fill="#58A6FF">X</tspan></text>
