<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">LUC4N3X</title>
  <desc id="desc">LUC4N3X developer lockup for dark interfaces.</desc>
  <defs>
    <linearGradient id="terminal" x1="44" y1="44" x2="298" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="100" x2="1040" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="36" y="38" width="262" height="214" rx="24" fill="url(#terminal)" stroke="#30363D" stroke-width="2"/>
  <circle cx="66" cy="66" r="5" fill="#484F58"/>
