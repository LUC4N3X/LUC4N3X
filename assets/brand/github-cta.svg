<svg width="320" height="44" viewBox="0 0 320 44" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Explore open source repositories">
  <defs>
    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D0D7DE"/>
      <stop offset="50%" stop-color="#0969DA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D0D7DE"/>
    </linearGradient>
    <style>
      @keyframes arrowNudge {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      .arrow-nudge {
        animation: arrowNudge 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Clean, solid developer button (rounded-md, native dev style) -->
  <rect x="1" y="1" width="318" height="42" rx="8" fill="#F6F8FA" stroke="url(#btnBorder)" stroke-width="1.2"/>

  <g transform="translate(24, 12)">
    <!-- GitHub Octocat Mark (20x20) -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M10 0C4.477 0 0 4.477 0 10c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-1.98 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.73 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V19c0 .27.16.59.67.5C17.14 18.16 20 14.42 20 10A10 10 0 0010 0z" fill="#1F2328"/>

    <text x="30" y="14.5" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.2">
      Explore open source repositories
    </text>

    <!-- Arrow in positioning group -->
    <g transform="translate(254, 10)">
      <g class="arrow-nudge">
        <path d="M 0 0 L 8 0 M 5 -3 L 8 0 L 5 3" stroke="#0969DA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>