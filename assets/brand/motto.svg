<svg width="460" height="74" viewBox="0 0 460 74" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Code. Build. Improve. Repeat">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F8FA"/>
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D0D7DE">
        <animate attributeName="stop-color" values="#D0D7DE;#8250DF;#0969DA;#D0D7DE" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8250DF">
        <animate attributeName="stop-color" values="#D0D7DE;#8250DF;#0969DA;#D0D7DE" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0969DA">
        <animate attributeName="stop-color" values="#D0D7DE;#8250DF;#0969DA;#D0D7DE" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Laser Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D0D7DE" stop-opacity="0"/>
      <stop offset="15%" stop-color="#8250DF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0969DA" stop-opacity="1"/>
      <stop offset="85%" stop-color="#2DA44E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D0D7DE" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonBeam" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .blink-cursor {
      animation: cursorBlink 1s infinite;
    }
    @keyframes beamBreath {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .laser-line {
      animation: beamBreath 2.5s ease-in-out infinite;
    }
    @keyframes laptopPulse {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 7px rgba(56, 189, 248, 0.9)); }
    }
    .laptop-glow {
      animation: laptopPulse 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Container Box (460 x 70) -->
  <rect x="2" y="2" width="456" height="70" rx="14" fill="url(#cardBg)" stroke="url(#borderGlow)" stroke-width="1.3"/>

  <!-- Centered Content -->
  <g transform="translate(38, 16)">
    <!-- 💻 Laptop Icon with Glowing Display -->
    <g transform="translate(0, 4)" class="laptop-glow">
      <!-- Laptop Base/Keyboard -->
      <path d="M 0 23 L 32 23 L 29 27 L 3 27 Z" fill="#8C959F"/>
      <rect x="12" y="23.5" width="8" height="1.5" rx="0.5" fill="#EAEEF2"/>
      <!-- Laptop Screen Bezel -->
      <rect x="3" y="2" width="26" height="19" rx="2.5" fill="#EAEEF2" stroke="#8C959F" stroke-width="1.2"/>
      <!-- Glowing Cyan Screen Display -->
      <rect x="5.5" y="4.5" width="21" height="14" rx="1" fill="#0969DA"/>
      <!-- Code Prompt Lines on Display -->
      <line x1="8" y1="7.5" x2="16" y2="7.5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
      <line x1="8" y1="11" x2="22" y2="11" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.9"/>
      <line x1="8" y1="14.5" x2="14" y2="14.5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Typography: Code. Build. Improve. Repeat -->
    <text x="46" y="25" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="0.3">
      Code. Build. Improve. Repeat
    </text>

    <!-- Blinking Terminal Cursor right after Repeat -->
    <rect x="330" y="9" width="7" height="18" rx="1.5" fill="#0969DA" class="blink-cursor"/>

    <!-- Glowing Laser Underline Beam -->
    <rect x="0" y="38" width="384" height="2" rx="1" fill="url(#beamGrad)" class="laser-line" filter="url(#neonBeam)"/>
  </g>
</svg>