<svg width="500" height="70" viewBox="0 0 500 70" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Code. Build. Improve. Repeat">
  <defs>
    <linearGradient id="pBeamLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D0D7DE" stop-opacity="0"/>
      <stop offset="35%" stop-color="#D0D7DE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#D0D7DE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D0D7DE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(250, 10)">
    <!-- Subtle acoustic micro-pulse line for light theme -->
    <g transform="translate(0, 12)">
      <line x1="-160" y1="0" x2="-28" y2="0" stroke="url(#pBeamLight)" stroke-width="1.2"/>
      <line x1="28" y1="0" x2="160" y2="0" stroke="url(#pBeamLight)" stroke-width="1.2"/>

      <!-- 7 micro audio bars -->
      <g stroke="#0284C7" stroke-width="1.8" stroke-linecap="round">
        <line x1="-18" y1="-3" x2="-18" y2="3" opacity="0.6"/>
        <line x1="-12" y1="-6" x2="-12" y2="6" opacity="0.8"/>
        <line x1="-6"  y1="-4" x2="-6"  y2="4" opacity="0.9"/>
        <line x1="0"   y1="-9" x2="0"   y2="9"/>
        <line x1="6"   y1="-4" x2="6"   y2="4" opacity="0.9"/>
        <line x1="12"  y1="-6" x2="12"  y2="6" opacity="0.8"/>
        <line x1="18"  y1="-3" x2="18"  y2="3" opacity="0.6"/>
      </g>
    </g>

    <!-- Clean motto light -->
    <text x="0" y="46" text-anchor="middle" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Montserrat, sans-serif" font-size="18.5" font-weight="700" letter-spacing="3.5">
      CODE<tspan fill="#0284C7"> · </tspan>BUILD<tspan fill="#0284C7"> · </tspan>IMPROVE<tspan fill="#0284C7"> · </tspan>REPEAT
    </text>
  </g>
</svg>