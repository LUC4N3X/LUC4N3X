<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 292" width="480" height="292" role="img" aria-label="Core Technology Telemetry">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#06080F"/>
    </linearGradient>
    <linearGradient id="rowBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="miniGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect width="480" height="292" rx="14" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Terminal Header -->
  <g>
    <circle cx="24" cy="22" r="3.5" fill="#EF4444" opacity="0.85"/>
    <circle cx="35" cy="22" r="3.5" fill="#F59E0B" opacity="0.85"/>
    <circle cx="46" cy="22" r="3.5" fill="#10B981" opacity="0.85"/>
    <text x="64" y="26" fill="#7DD3FC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">CORE_STACK.SYS // RUNTIME</text>
    <circle cx="428" cy="22" r="3" fill="#34D399" filter="url(#miniGlow)"/>
    <text x="456" y="25" text-anchor="end" fill="#34D399" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing="1">ONLINE</text>
    <line x1="16" y1="38" x2="464" y2="38" stroke="#1E293B" stroke-width="1"/>
  </g>

  <!-- Row 1: Android Media -->
  <g transform="translate(16, 48)">
    <rect width="448" height="46" rx="7" fill="#0E1422" stroke="#1E293B" stroke-width="1"/>
    <rect x="8" y="10" width="50" height="26" rx="4" fill="#7C3AED" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1"/>
    <text x="33" y="27" text-anchor="middle" fill="#C4B5FD" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" font-weight="800" letter-spacing="0.5">AUDIO</text>
    <text x="68" y="22" fill="#F8FAFC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700">Kotlin · Jetpack Compose</text>
    <text x="68" y="35" fill="#818CF8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5">Media3 / ExoPlayer · Gapless Pipeline</text>
    
    <!-- Audio Waveform Visualizer -->
    <g transform="translate(382, 13)">
      <rect x="0" y="14" width="3" height="6" rx="1.5" fill="#818CF8"/>
      <rect x="6" y="8" width="3" height="12" rx="1.5" fill="#38BDF8"/>
      <rect x="12" y="3" width="3" height="17" rx="1.5" fill="#A78BFA"/>
      <rect x="18" y="9" width="3" height="11" rx="1.5" fill="#38BDF8"/>
      <rect x="24" y="5" width="3" height="15" rx="1.5" fill="#818CF8"/>
      <rect x="30" y="11" width="3" height="9" rx="1.5" fill="#A78BFA"/>
      <rect x="36" y="7" width="3" height="13" rx="1.5" fill="#38BDF8"/>
      <rect x="42" y="13" width="3" height="7" rx="1.5" fill="#818CF8"/>
    </g>
  </g>

  <!-- Row 2: Async & Backend -->
  <g transform="translate(16, 102)">
    <rect width="448" height="46" rx="7" fill="#0E1422" stroke="#1E293B" stroke-width="1"/>
    <rect x="8" y="10" width="50" height="26" rx="4" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
    <text x="33" y="27" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" font-weight="800" letter-spacing="0.5">ASYNC</text>
    <text x="68" y="22" fill="#F8FAFC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700">Python · FastAPI · AsyncIO</text>
    <text x="68" y="35" fill="#38BDF8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5">Concurrent Queues · Tasks · Node.js</text>
    
    <!-- Concurrent Metric Pill -->
    <g transform="translate(366, 12)">
      <rect width="70" height="22" rx="4" fill="#0284C7" fill-opacity="0.15" stroke="#0284C7" stroke-width="0.8"/>
      <text x="35" y="15" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" font-weight="700">CONCURRENT</text>
    </g>
  </g>

  <!-- Row 3: Data & Offline -->
  <g transform="translate(16, 156)">
    <rect width="448" height="46" rx="7" fill="#0E1422" stroke="#1E293B" stroke-width="1"/>
    <rect x="8" y="10" width="50" height="26" rx="4" fill="#059669" fill-opacity="0.2" stroke="#34D399" stroke-width="1"/>
    <text x="33" y="27" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" font-weight="800" letter-spacing="0.5">DATA</text>
    <text x="68" y="22" fill="#F8FAFC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700">Room · SQLite · Redis</text>
    <text x="68" y="35" fill="#34D399" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5">Local Offline Vault · Cache Hierarchy</text>

    <!-- Offline Vault Badge -->
    <g transform="translate(366, 12)">
      <rect width="70" height="22" rx="4" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="0.8"/>
      <text x="35" y="15" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" font-weight="700">OFFLINE-1ST</text>
    </g>
  </g>

  <!-- Row 4: Systems & Infra -->
  <g transform="translate(16, 210)">
    <rect width="448" height="46" rx="7" fill="#0E1422" stroke="#1E293B" stroke-width="1"/>
    <rect x="8" y="10" width="50" height="26" rx="4" fill="#D97706" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
    <text x="33" y="27" text-anchor="middle" fill="#FCD34D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" font-weight="800" letter-spacing="0.5">INFRA</text>
    <text x="68" y="22" fill="#F8FAFC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700">Docker · Linux · Cloudflare</text>
    <text x="68" y="35" fill="#F59E0B" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5">Lean VPS · Edge Proxy · GitHub Actions</text>

    <!-- Edge Routing Pill -->
    <g transform="translate(366, 12)">
      <rect width="70" height="22" rx="4" fill="#D97706" fill-opacity="0.15" stroke="#D97706" stroke-width="0.8"/>
      <text x="35" y="15" text-anchor="middle" fill="#FCD34D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" font-weight="700">EDGE ROUTED</text>
    </g>
  </g>

  <!-- Bottom Console Line -->
  <g transform="translate(16, 266)">
    <line x1="0" y1="0" x2="448" y2="0" stroke="#1E293B" stroke-width="1"/>
    <text x="2" y="16" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.5">&gt; ZERO MEMORY LEAKS · REPRODUCIBLE BUILDS</text>
    <text x="446" y="16" text-anchor="end" fill="#38BDF8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" letter-spacing="0.8">STABLE █</text>
  </g>
</svg>
