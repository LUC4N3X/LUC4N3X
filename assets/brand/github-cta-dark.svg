<svg width="300" height="46" viewBox="0 0 300 46" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Explore Repositories">
  <defs>
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#30363D"/>
    </linearGradient>

    <style>
      @keyframes nudge {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      .arrow-nudge {
        animation: nudge 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Clean Pill Background -->
  <rect x="1" y="1" width="298" height="44" rx="22" fill="#161B22" stroke="url(#pillBorder)" stroke-width="1.2"/>

  <!-- Centered Content Group -->
  <g transform="translate(48, 13)">
    <!-- GitHub Octocat Mark (20x20) -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M10 0C4.477 0 0 4.477 0 10c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-1.98 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.73 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V19c0 .27.16.59.67.5C17.14 18.16 20 14.42 20 10A10 10 0 0010 0z" fill="#F0F6FC"/>

    <!-- Label -->
    <text x="30" y="15" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.2">
      Explore Repositories
    </text>

    <!-- Arrow (nested in positioning group to prevent CSS transform conflict) -->
    <g transform="translate(182, 10)">
      <g class="arrow-nudge">
        <path d="M 0 0 L 10 0 M 6 -4 L 10 0 L 6 4" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>