<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">LUC4N3X mark</title>
  <desc id="desc">Developer terminal mark built around the LUC4N3X signature X.</desc>
  <defs>
    <linearGradient id="panel" x1="36" y1="36" x2="284" y2="284" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="74" y1="95" x2="256" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="28" y="28" width="264" height="264" rx="34" fill="url(#panel)" stroke="#30363D" stroke-width="3"/>
  <circle cx="58" cy="58" r="5" fill="#484F58"/>
  <circle cx="76" cy="58" r="5" fill="#484F58"/>
  <circle cx="94" cy="58" r="5" fill="#484F58"/>
  <path d="M28 82H292" stroke="#21262D" stroke-width="2"/>
  <path d="M68 132L104 158L68 184" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>
  <path d="M122 186H174" stroke="#F0F6FC" stroke-width="12" stroke-linecap="square"/>
  <path d="M202 116L260 206" stroke="#F0F6FC" stroke-width="14" stroke-linecap="square"/>
  <path d="M260 116L202 206" stroke="url(#accent)" stroke-width="14" stroke-linecap="square" filter="url(#glow)"/>
  <rect x="248" y="232" width="14" height="14" fill="#58A6FF"/>
</svg>
