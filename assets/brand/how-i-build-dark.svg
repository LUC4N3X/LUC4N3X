<svg width="510" height="46" viewBox="0 0 510 46" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Code. Build. Improve. Repeat - Explore Repositories">
  <defs>
    <linearGradient id="hPillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#30363D"/>
    </linearGradient>

