    </linearGradient>

    <style>
      @keyframes nudgeA {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      .arrow-nudge {
        animation: nudgeA 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Capsule Outer Container -->
  <rect x="1" y="1" width="508" height="44" rx="22" fill="#161B22" stroke="url(#hPillGrad)" stroke-width="1.2"/>

  <!-- Left: 💻 Code. Build. Improve. Repeat -->
  <g transform="translate(18, 13)">
    <!-- Crisp Vector Laptop -->
    <rect x="2" y="1" width="18" height="12" rx="1.5" fill="#1C2128" stroke="#484F58" stroke-width="1"/>
    <rect x="3.5" y="2.5" width="15" height="9" rx="0.8" fill="url(#scrGrad)"/>
    <line x1="5.5" y1="5" x2="8.5" y2="5" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.95"/>
    <line x1="5.5" y1="7" x2="12" y2="7" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.95"/>
    <line x1="5.5" y1="9" x2="10" y2="9" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.8"/>
    <path d="M 0 14 L 22 14 L 20 16.5 L 2 16.5 Z" fill="#30363D"/>

