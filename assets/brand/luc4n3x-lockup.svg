<svg width="920" height="200" viewBox="0 0 920 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LUC4N3X Logo">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0969DA"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0550AE"/>
    </linearGradient>

    <!-- Emblem Container Gradient -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F8FA"/>
      <stop offset="100%" stop-color="#EAEEF2"/>
    </linearGradient>

    <!-- Subtle Beam Underline -->
    <linearGradient id="beamUnderline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#D0D7DE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#D0D7DE" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- LEFT: The Iconic Geometric Monogram Logo Emblem (144x144) -->
  <g transform="translate(42, 28)">
    <!-- Outer Shield / Hexagonal Tech Tile -->
    <path d="M 72 6 L 134 40 L 134 104 L 72 138 L 10 104 L 10 40 Z" fill="url(#emblemBg)" stroke="#D0D7DE" stroke-width="1.8"/>
    <!-- Subtle Inner Rim Highlight -->
    <path d="M 72 6 L 134 40 L 134 104 L 72 138 L 10 104 L 10 40 Z" stroke="url(#brandGrad)" stroke-width="1.8" opacity="0.5"/>

    <!-- Geometric 'L' Component (Clean, Solid, Architecture) -->
    <path d="M 38 42 L 38 102 L 76 102" stroke="#1F2328" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Geometric 'X' Component (Dynamic, Luminous, Cyber Crossing) -->
    <!-- Downward Diagonal -->
    <path d="M 64 56 L 106 102" stroke="url(#brandGrad)" stroke-width="7.5" stroke-linecap="round" filter="url(#coreGlow)"/>
    <!-- Upward Diagonal with clean break for depth -->
    <path d="M 106 56 L 86 78 M 70 96 L 64 102" stroke="url(#brandGrad)" stroke-width="7.5" stroke-linecap="round"/>

    <!-- Luminous Central Nexus Dot -->
    <circle cx="72" cy="72" r="3.5" fill="#0969DA"/>
  </g>

  <!-- RIGHT: Typographic Brand Lockup -->
  <g transform="translate(225, 42)">
    <!-- Top Status / Role Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="24" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#1A7F37"/>
      <text x="22" y="16" fill="#1A7F37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">SYSTEMS DEV</text>
      <text x="104" y="16" fill="#656D76" font-family="'JetBrains Mono', monospace" font-size="11">~</text>
    </g>

    <!-- Brand Name: LUC4N3X (Bold, Precision Display Typography) -->
    <text x="0" y="70" fill="#1F2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="3.5">
      LUC4N3<tspan fill="url(#brandGrad)">X</tspan>
    </text>

    <!-- Underline Horizon Beam -->
    <rect x="0" y="86" width="560" height="1.8" rx="0.9" fill="url(#beamUnderline)"/>

    <!-- Subtitle Meta Information -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" fill="#656D76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" letter-spacing="0.3">
        Android Engineering <tspan fill="#0969DA">·</tspan> Media Pipelines <tspan fill="#0969DA">·</tspan> Linux Tools
      </text>

      <!-- Git Branch Pill on Right -->
      <g transform="translate(480, -14)">
        <rect x="0" y="0" width="76" height="20" rx="4" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
        <circle cx="8" cy="10" r="2.5" fill="#0969DA"/>
        <text x="16" y="14" fill="#656D76" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">git:main</text>
      </g>
    </g>
  </g>
</svg>