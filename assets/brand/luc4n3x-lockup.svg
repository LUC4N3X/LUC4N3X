<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
  <title id="title">LUC4N3X</title>
  <desc id="desc">LUC4N3X author mark and wordmark.</desc>

  <!--
    LUC4N3X author mark.
    The original L / 4 / X construction is preserved; only geometry,
    optical balance and spacing are refined for a cleaner lockup.
  -->
  <g transform="translate(58 38)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- L: structural anchor -->
    <path d="M20 10V196H108" stroke="#0D1117" stroke-width="27"/>

    <!-- X backbone -->
    <path d="M87 10L202 196" stroke="#0D1117" stroke-width="25"/>

    <!-- 4: signature accent, sharing the crossing geometry -->
    <path d="M204 10L105 140H211M190 91V196" stroke="#0969DA" stroke-width="23"/>
  </g>

  <!-- Wordmark -->
  <text x="354" y="191"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="116"
        font-weight="820"
        letter-spacing="3.2"
        fill="#0D1117">
    LUC<tspan fill="#0969DA">4</tspan>N3<tspan fill="#0969DA">X</tspan>
  </text>

  <!-- restrained baseline accent: part of the lockup, not decoration -->
  <path d="M356 222H886" stroke="#D0D7DE" stroke-width="2"/>
  <path d="M356 222H484" stroke="#0969DA" stroke-width="2"/>
</svg>
