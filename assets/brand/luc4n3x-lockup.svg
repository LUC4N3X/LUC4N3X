<svg width="800" height="180" viewBox="0 0 800 180" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="LUC4N3X">
  <defs>
    <!-- Brand Gradients for Light Mode -->
    <linearGradient id="sapphireCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="sapphireIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="laserBeamLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#4F46E5"/>
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Left: Pure Vector Minimalist Sapphire LX Monogram -->
  <g transform="translate(85, 15)" filter="url(#crispShadow)">
    <path d="M 28 22 L 28 116 L 86 116 L 86 102 L 42 102 L 42 22 Z"
          fill="url(#sapphireCyan)"/>

    <path d="M 35 30 L 35 109 L 80 109"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>

    <path d="M 122 22 L 100 22 L 54 86 L 54 104 L 72 104 L 122 36 Z"
          fill="url(#sapphireIndigo)"/>
    <line x1="110" y1="26" x2="63" y2="95" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

    <g>
      <path d="M 52 28 L 68 28 L 86 54 L 74 68 Z" fill="url(#sapphireCyan)"/>
      <line x1="56" y1="32" x2="80" y2="61" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.95"/>

      <path d="M 88 72 L 122 116 L 104 116 L 76 82 Z" fill="url(#sapphireCyan)"/>
      <line x1="82" y1="77" x2="114" y2="114" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    </g>

    <polygon points="76,66 88,72 82,82 72,76" fill="#0A0E1A" opacity="0.45"/>
    <circle cx="80" cy="74" r="3" fill="#0284C7"/>
  </g>

  <!-- Right: Master Typography -->
  <g transform="translate(265, 20)">
    <circle cx="4" cy="18" r="3.5" fill="#0284C7"/>
    <text x="16" y="22" fill="#0284C7" font-family="'JetBrains Mono', SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="3.5">SOFTWARE ENGINEER &amp; CREATOR</text>

    <text x="0" y="74" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Montserrat, sans-serif" font-size="64" font-weight="900" letter-spacing="4">
      LUC4N3<tspan fill="url(#sapphireCyan)">X</tspan>
    </text>

    <rect x="0" y="94" width="450" height="2.5" rx="1" fill="url(#laserBeamLight)"/>
    <circle cx="0" cy="95" r="3.5" fill="#0284C7"/>
  </g>
</svg>