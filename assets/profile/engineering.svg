<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Engineering workflow">
  <rect x="1" y="1" width="1198" height="248" rx="26" fill="#080C14" stroke="#273247"/>
  <text x="42" y="45" fill="#98A7BB" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">HOW I LIKE TO BUILD</text>
  <text x="42" y="82" fill="#F2F6FC" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="800">Small diffs. Real constraints. Fresh evidence.</text>
  <g transform="translate(42 112)"><rect width="330" height="94" rx="18" fill="#0D1422" stroke="#273247"/><circle cx="28" cy="27" r="7" fill="#58A6FF"/><text x="48" y="33" fill="#F2F6FC" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">01 · Inspect</text><text x="22" y="63" fill="#98A7BB" font-family="Segoe UI,Arial,sans-serif" font-size="13">Read the real repo, rules and versions first.</text><text x="22" y="82" fill="#98A7BB" font-family="Segoe UI,Arial,sans-serif" font-size="13">Assumptions are cheap; context is not.</text></g>
  <g transform="translate(390 112)"><rect width="330" height="94" rx="18" fill="#0D1422" stroke="#273247"/><circle cx="28" cy="27" r="7" fill="#A78BFA"/><text x="48" y="33" fill="#F2F6FC" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">02 · Change</text><text x="22" y="63" fill="#98A7BB" font-family="Segoe UI,Arial,sans-serif" font-size="13">Fix the smallest useful part without collateral churn.</text><text x="22" y="82" fill="#98A7BB" font-family="Segoe UI,Arial,sans-serif" font-size="13">Keep the architecture recognizable.</text></g>
  <g transform="translate(738 112)"><rect width="420" height="94" rx="18" fill="#0D1422" stroke="#273247"/><circle cx="28" cy="27" r="7" fill="#4ADE80"/><text x="48" y="33" fill="#F2F6FC" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">03 · Prove</text><text x="22" y="63" fill="#98A7BB" font-family="Segoe UI,Arial,sans-serif" font-size="13">Test the actual acceptance criterion: build, device, browser, benchmark.</text><text x="22" y="82" fill="#98A7BB" font-family="Segoe UI,Arial,sans-serif" font-size="13">If the evidence is missing, say it is missing.</text></g>
</svg>