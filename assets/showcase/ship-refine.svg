<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Ship and refine showcase</title>
  <desc id="desc">A developer release flow with pull request, changelog and successful build panels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#A371F7"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="758" height="518" rx="28" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>
  <text x="42" y="52" fill="#58A6FF" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="2">SHIP / REFINE</text>
  <text x="42" y="91" fill="#F0F6FC" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="750">From rough builds to polished releases</text>
  <text x="42" y="120" fill="#8B949E" font-family="Inter,Segoe UI,sans-serif" font-size="16">Build · test · ship · keep improving</text>

  <g transform="translate(42 154)">
    <rect width="436" height="132" rx="18" fill="#161B22" stroke="#30363D"/>
    <circle cx="28" cy="28" r="10" fill="#238636"/>
    <path d="M24 28L27 31L33 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="32" fill="#F0F6FC" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">PR #517 · playback resilience pass</text>
    <text x="24" y="64" fill="#8B949E" font-family="SFMono-Regular,Consolas,monospace" font-size="12">+ fallback resolver for flaky upstreams</text>
    <text x="24" y="86" fill="#8B949E" font-family="SFMono-Regular,Consolas,monospace" font-size="12">+ queue recovery after source failure</text>
    <text x="24" y="108" fill="#8B949E" font-family="SFMono-Regular,Consolas,monospace" font-size="12">+ emulator regression coverage</text>
  </g>

  <g transform="translate(42 306)">
    <rect width="290" height="156" rx="18" fill="#161B22" stroke="#30363D"/>
    <text x="22" y="30" fill="#58A6FF" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">RELEASE</text>
    <text x="22" y="66" fill="#F0F6FC" font-family="Inter,Segoe UI,sans-serif" font-size="27" font-weight="750">Levyra 2.5.2</text>
    <text x="22" y="94" fill="#8B949E" font-family="Inter,Segoe UI,sans-serif" font-size="13">Home and artist experience</text>
    <rect x="22" y="116" width="104" height="23" rx="11.5" fill="#0D2847"/>
    <text x="39" y="132" fill="#58A6FF" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">CHANGELOG</text>
    <rect x="138" y="116" width="92" height="23" rx="11.5" fill="#102D1B"/>
    <text x="157" y="132" fill="#3FB950" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="700">SHIPPED</text>
  </g>

  <g transform="translate(350 306)">
    <rect width="128" height="156" rx="18" fill="#0B0F14" stroke="#30363D"/>
    <text x="18" y="28" fill="#8B949E" font-family="SFMono-Regular,Consolas,monospace" font-size="11">CI / android</text>
    <circle cx="64" cy="74" r="29" fill="#0F2D1A" stroke="#3FB950" stroke-width="2"/>
    <path d="M50 74L59 83L79 62" fill="none" stroke="#3FB950" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="127" fill="#3FB950" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">ALL CHECKS</text>
    <text x="35" y="144" fill="#3FB950" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">PASSED</text>
  </g>

  <g transform="translate(510 154)">
    <rect width="208" height="308" rx="24" fill="#0B0F14" stroke="#30363D"/>
    <rect x="15" y="15" width="178" height="278" rx="18" fill="#0D1117"/>
    <text x="30" y="50" fill="#8B949E" font-family="Inter,Segoe UI,sans-serif" font-size="11" letter-spacing="1">LATEST BUILD</text>
    <rect x="30" y="70" width="148" height="118" rx="14" fill="#182A4B"/>
    <circle cx="104" cy="129" r="34" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M97 113L121 129L97 145Z" fill="#58A6FF"/>
    <text x="30" y="220" fill="#F0F6FC" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">Test it where it breaks</text>
    <text x="30" y="245" fill="#8B949E" font-family="Inter,Segoe UI,sans-serif" font-size="12">emulator · devices</text>
    <text x="30" y="264" fill="#8B949E" font-family="Inter,Segoe UI,sans-serif" font-size="12">bad networks · edge cases</text>
  </g>

  <g transform="translate(42 488)" font-family="Inter,Segoe UI,sans-serif" font-size="12">
    <text x="0" y="0" fill="#58A6FF">small sharp fixes</text>
    <text x="150" y="0" fill="#8B949E">clean interfaces</text>
    <text x="282" y="0" fill="#A371F7">ship and refine</text>
  </g>
</svg>