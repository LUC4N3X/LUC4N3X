    <text x="48" y="138" fill="#C084FC" font-family="SFMono-Regular,Consolas,monospace" font-size="12">fun</text>
    <text x="78" y="138" fill="#67E8F9" font-family="SFMono-Regular,Consolas,monospace" font-size="12">load</text>
    <text x="108" y="138" fill="#E2E8F0" font-family="SFMono-Regular,Consolas,monospace" font-size="12">() = viewModelScope.launch {</text>
    <text x="20" y="160" fill="#64748B" font-family="SFMono-Regular,Consolas,monospace" font-size="12">07</text>
    <text x="64" y="160" fill="#E2E8F0" font-family="SFMono-Regular,Consolas,monospace" font-size="12">state.update { it.copy(loading = </text>
