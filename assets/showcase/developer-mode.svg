<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">LUC4N3X developer mode</title>
  <desc id="desc">A developer workbench with code, emulator and terminal panels.</desc>
  <defs>
