    <text x="351" y="160" fill="#E2E8F0" font-family="SFMono-Regular,Consolas,monospace" font-size="12">) }</text>
    <text x="20" y="182" fill="#64748B" font-family="SFMono-Regular,Consolas,monospace" font-size="12">08</text>
    <text x="64" y="182" fill="#E2E8F0" font-family="SFMono-Regular,Consolas,monospace" font-size="12">repo.fetch().retry(2).collect(::render)</text>
    <text x="20" y="204" fill="#64748B" font-family="SFMono-Regular,Consolas,monospace" font-size="12">09</text>
    <text x="48" y="204" fill="#E2E8F0" font-family="SFMono-Regular,Consolas,monospace" font-size="12">}</text>
