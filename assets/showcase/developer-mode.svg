    <text x="20" y="104" fill="#64748B" font-family="SFMono-Regular,Consolas,monospace" font-size="12">03</text>
    <text x="48" y="104" fill="#E2E8F0" font-family="SFMono-Regular,Consolas,monospace" font-size="12">) : ViewModel() {</text>
