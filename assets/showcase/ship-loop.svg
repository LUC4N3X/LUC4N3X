<svg xmlns="http://www.w3.org/2000/svg" width="580" height="370" viewBox="0 0 580 370" role="img" aria-labelledby="title desc">
  <title id="title">Ship loop</title>
  <desc id="desc">A release workflow showing pull request, CI, containers and edge delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#09111C"/><stop offset="1" stop-color="#0B1322"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#60A5FA"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="578" height="368" rx="24" fill="url(#bg)" stroke="#253244" stroke-width="2"/>
  <text x="34" y="50" fill="#A5B4FC" font-family="SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2">SHIP LOOP</text>
  <text x="34" y="84" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="800">Small fixes. Clean builds. Better releases.</text>
  <text x="34" y="109" fill="#94A3B8" font-family="Inter,Segoe UI,sans-serif" font-size="14">review · test · package · ship</text>

  <g transform="translate(34 142)">
    <rect width="250" height="188" rx="16" fill="#0A0F18" stroke="#263244"/>
    <text x="18" y="28" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">Pull request</text>
    <rect x="18" y="44" width="214" height="34" rx="8" fill="#111827"/>
    <circle cx="34" cy="61" r="8" fill="#22C55E"/>
    <text x="50" y="65" fill="#F8FAFC" font-family="SFMono-Regular,Consolas,monospace" font-size="11">fix: edge-case recovery</text>
    <rect x="18" y="90" width="214" height="26" rx="7" fill="#0F172A"/>
    <text x="30" y="107" fill="#93C5FD" font-family="SFMono-Regular,Consolas,monospace" font-size="10">tests</text>
    <text x="182" y="107" fill="#22C55E" font-family="SFMono-Regular,Consolas,monospace" font-size="10">passed</text>
    <rect x="18" y="124" width="214" height="26" rx="7" fill="#0F172A"/>
    <text x="30" y="141" fill="#C4B5FD" font-family="SFMono-Regular,Consolas,monospace" font-size="10">review</text>
    <text x="181" y="141" fill="#22C55E" font-family="SFMono-Regular,Consolas,monospace" font-size="10">clean</text>
    <rect x="18" y="160" width="74" height="18" rx="9" fill="#052E16"/><text x="35" y="173" fill="#86EFAC" font-family="SFMono-Regular,Consolas,monospace" font-size="9">MERGE</text>
  </g>

  <g transform="translate(304 142)">
    <rect width="242" height="82" rx="16" fill="#0A0F18" stroke="#263244"/>
    <text x="18" y="26" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700">CI / package</text>
    <circle cx="28" cy="54" r="7" fill="#22C55E"/><text x="42" y="58" fill="#E2E8F0" font-family="SFMono-Regular,Consolas,monospace" font-size="10">build</text>
    <circle cx="102" cy="54" r="7" fill="#22C55E"/><text x="116" y="58" fill="#E2E8F0" font-family="SFMono-Regular,Consolas,monospace" font-size="10">test</text>
    <circle cx="174" cy="54" r="7" fill="#22C55E"/><text x="188" y="58" fill="#E2E8F0" font-family="SFMono-Regular,Consolas,monospace" font-size="10">tag</text>
  </g>

  <g transform="translate(304 238)">
    <rect width="112" height="92" rx="16" fill="#0A0F18" stroke="#263244"/>
    <text x="14" y="24" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">Docker</text>
    <path d="M22 52h50v22H22z" fill="#0EA5E9" opacity="0.18" stroke="#38BDF8"/>
    <path d="M28 58h8v8h-8zm11 0h8v8h-8zm11 0h8v8h-8zm11 0h8v8h-8z" fill="#7DD3FC"/>
    <path d="M28 71h42" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(434 238)">
    <rect width="112" height="92" rx="16" fill="#0A0F18" stroke="#263244"/>
    <text x="14" y="24" fill="#CBD5E1" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">Edge</text>
    <circle cx="56" cy="58" r="22" fill="#F97316" opacity="0.12" stroke="#FB923C"/>
    <path d="M35 58h42M56 37c8 8 12 14 12 21s-4 13-12 21M56 37c-8 8-12 14-12 21s4 13 12 21" fill="none" stroke="#FDBA74" stroke-width="2"/>
  </g>

  <path d="M286 236H298" stroke="url(#accent)" stroke-width="3"/>
  <path d="M286 278H298" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="292" cy="236" r="4" fill="#60A5FA"/>
  <circle cx="292" cy="278" r="4" fill="#A78BFA"/>

  <g font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">
    <rect x="34" y="340" width="72" height="22" rx="11" fill="#101827" stroke="#263244"/><text x="53" y="355" fill="#86EFAC">review</text>
    <rect x="114" y="340" width="64" height="22" rx="11" fill="#101827" stroke="#263244"/><text x="135" y="355" fill="#93C5FD">test</text>
    <rect x="186" y="340" width="68" height="22" rx="11" fill="#101827" stroke="#263244"/><text x="205" y="355" fill="#C4B5FD">ship</text>
  </g>
</svg>