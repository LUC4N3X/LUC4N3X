    <path d="M31 382H46V373H52V389H59V368H66V392H73V376H80V386H87V371H94V389H101V365H108V392H115V377H122V387H129V370H136V390H143V373H150V385H157V378H164V383H204" stroke="url(#accent)" stroke-width="2.5"/>
