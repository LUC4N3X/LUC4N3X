<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Levyra now playing showcase</title>
  <desc id="desc">A dark product card showing Levyra playback and discovery screens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#39C5CF"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#13305F"/>
      <stop offset="0.55" stop-color="#2F6FEB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1198" height="518" rx="28" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>
  <path d="M0 410C180 360 292 456 470 410C656 362 810 350 1200 420V520H0Z" fill="#58A6FF" opacity="0.035"/>
  <circle cx="875" cy="128" r="150" fill="#2F81F7" opacity="0.05"/>

