    <text x="0" y="86" fill="#F0F6FC" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="750">Levyra, built one release at a time</text>
    <text x="0" y="122" fill="#8B949E" font-family="Inter,Segoe UI,sans-serif" font-size="21">Android music app · playback · discovery · polish</text>

