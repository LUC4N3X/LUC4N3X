<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Android workbench showcase</title>
  <desc id="desc">A developer workspace with Kotlin playback code, terminal output and an emulator.</desc>
  <defs>
