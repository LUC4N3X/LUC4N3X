    <text x="72" y="22" fill="#8B949E" font-family="SFMono-Regular,Consolas,monospace" font-size="12">PlayerViewModel.kt</text>
    <g font-family="SFMono-Regular,Consolas,monospace" font-size="13">
      <text x="22" y="62" fill="#C678DD">class</text><text x="69" y="62" fill="#61AFEF">PlayerViewModel</text><text x="187" y="62" fill="#ABB2BF">(</text>
      <text x="38" y="86" fill="#C678DD">private val</text><text x="118" y="86" fill="#E5C07B"> repo</text><text x="155" y="86" fill="#ABB2BF">: MusicRepository</text>
      <text x="22" y="110" fill="#ABB2BF">) : ViewModel() {</text>
      <text x="38" y="140" fill="#C678DD">fun</text><text x="65" y="140" fill="#61AFEF"> play</text><text x="102" y="140" fill="#ABB2BF">(track: Track) = viewModelScope.launch {</text>
      <text x="58" y="164" fill="#ABB2BF">repo.play(track)</text>
      <text x="58" y="188" fill="#56B6C2">_state.update</text><text x="152" y="188" fill="#ABB2BF"> { it.copy(isPlaying = </text><text x="327" y="188" fill="#D19A66">true</text><text x="354" y="188" fill="#ABB2BF">) }</text>
      <text x="38" y="212" fill="#ABB2BF">}</text>
    </g>
  </g>

