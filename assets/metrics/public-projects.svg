  <path d="M56 432H1144" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <text x="56" y="452" fill="#526174" font-family="SFMono-Regular,Consolas,monospace" font-size="11">REAL REPOSITORIES · STATIC LOCAL ARTWORK · NO REMOTE RENDERER</text>
