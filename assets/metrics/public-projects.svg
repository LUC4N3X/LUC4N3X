<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">LUC4N3X public projects</title>
  <desc id="desc">A self-contained project board highlighting real public repositories.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080C13"/>
      <stop offset="1" stop-color="#0D1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#60A5FA" opacity="0.035"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="468" rx="30" fill="url(#bg)" stroke="#2A3443" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="468" rx="30" fill="url(#dots)"/>
  <path d="M56 92H1144" stroke="#1F2937"/>
  <text x="56" y="48" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="28" font-weight="800">Public projects</text>
  <text x="56" y="74" fill="#7E8EA3" font-family="Inter,Segoe UI,sans-serif" font-size="14">A small slice of what is actually public on the profile.</text>
  <text x="1030" y="56" fill="#60A5FA" font-family="SFMono-Regular,Consolas,monospace" font-size="12">LUC4N3X / OPEN</text>

