    <text x="28" y="61" fill="#8FA3B8" font-family="Inter,Segoe UI,sans-serif" font-size="14">Modern open-source music player for Android &amp; Windows with playback, discovery, synced lyrics and rich artwork.</text>
    <rect x="817" y="23" width="78" height="28" rx="14" fill="#17112A" stroke="#4B3F7A"/>
