    <text x="26" y="78" fill="#8FA3B8" font-family="Inter,Segoe UI,sans-serif" font-size="14">Instagram operations console with persistent sessions,</text>
    <text x="26" y="101" fill="#8FA3B8" font-family="Inter,Segoe UI,sans-serif" font-size="14">smart comment generation and queued workflows.</text>
    <rect x="26" y="124" width="102" height="26" rx="13" fill="#111E31" stroke="#244D75"/>
    <text x="40" y="142" fill="#93C5FD" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">TypeScript</text>
    <text x="354" y="142" fill="#64748B" font-family="SFMono-Regular,Consolas,monospace" font-size="11">automation · Gemini</text>
  </g>

