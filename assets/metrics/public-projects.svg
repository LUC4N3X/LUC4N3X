    <rect x="907" y="23" width="72" height="28" rx="14" fill="#111827" stroke="#334155"/>
    <text x="929" y="42" fill="#F8FAFC" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">43 ★</text>
    <rect x="991" y="23" width="69" height="28" rx="14" fill="#0D2847" stroke="#244D75"/>
    <text x="1012" y="42" fill="#93C5FD" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">GPL-3</text>
  </g>

  <g transform="translate(56 232)">
