    <rect width="530" height="168" rx="22" fill="#0A111B" stroke="#2A3443"/>
    <path d="M26 33H74" stroke="#4ADE80" stroke-width="3" stroke-linecap="round"/>
    <circle cx="26" cy="33" r="6" fill="#4ADE80"/>
    <text x="94" y="39" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="800">antigravity-thalarch</text>
    <text x="26" y="78" fill="#8FA3B8" font-family="Inter,Segoe UI,sans-serif" font-size="14">Multi-agent engineering skill, visual-production system</text>
    <text x="26" y="101" fill="#8FA3B8" font-family="Inter,Segoe UI,sans-serif" font-size="14">and reliability layer for AI coding agents.</text>
    <rect x="26" y="124" width="78" height="26" rx="13" fill="#10251B" stroke="#28563A"/>
    <text x="44" y="142" fill="#86EFAC" font-family="SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">Python</text>
    <text x="340" y="142" fill="#64748B" font-family="SFMono-Regular,Consolas,monospace" font-size="11">agents · reliability</text>
