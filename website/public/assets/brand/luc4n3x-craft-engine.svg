    <path d="M 16,75 C 50,110 90,30 140,75 C 190,120 230,25 280,75 C 330,125 370,40 420,75 C 450,100 475,55 488,75" fill="none" stroke="url(#wavePink)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

