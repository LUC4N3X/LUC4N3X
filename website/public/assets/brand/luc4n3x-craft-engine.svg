      <circle cx="26" cy="28" r="10" fill="rgba(52,211,153,0.15)"/>
      <path d="M21 28 C21 24 31 24 31 28 C31 32 21 32 21 28 Z" stroke="#34d399" stroke-width="1.8"/>
      <text x="44" y="32" fill="#ffffff" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600">Direct TLS 1.3</text>
      <text x="16" y="58" fill="#94a3b8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5">No proxy interception</text>
      <text x="16" y="74" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9">untracked CDN pipe</text>
    </g>
