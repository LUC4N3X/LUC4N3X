      <text x="10" y="17" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="600">RingBuffer · 128kb</text>
    </g>

    <g opacity="0.75" transform="translate(384, 16)">
      <rect width="96" height="26" rx="8" fill="rgba(244,63,94,0.08)" stroke="rgba(244,63,94,0.2)" stroke-width="1"/>
      <text x="10" y="17" fill="#f43f5e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="600">Telemetry · 0b</text>
