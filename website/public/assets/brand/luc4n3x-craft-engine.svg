  <circle cx="64" cy="45" r="4.5" fill="#fbbf24" opacity="0.85"/>
  <circle cx="80" cy="45" r="4.5" fill="#34d399" opacity="0.85"/>
  
  <text x="105" y="49" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600">levyra-engine : zero-telemetry-pipeline</text>
  <rect x="442" y="34" width="76" height="22" rx="11" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <circle cx="454" cy="45" r="3" fill="#34d399"/>
  <text x="464" y="49" fill="#38bdf8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700">ACTIVE</text>

